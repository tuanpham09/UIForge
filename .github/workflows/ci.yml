name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: uiforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Debug Issue 13 Biome diagnostics
        if: github.event.pull_request.number == 39
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pnpm exec biome check packages/codegen --reporter=json > /tmp/uiforge-biome.json 2>&1
          status=$?
          gh api "repos/${{ github.repository }}/issues/39/comments" -f body="```json
$(head -c 12000 /tmp/uiforge-biome.json)
```"
          exit $status

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Upload MCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-report
          path: artifacts/mcp/
          if-no-files-found: warn

      - name: Build
        run: pnpm build

      - name: Upload UI Schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-schema-report
          path: artifacts/ui-schema/
          if-no-files-found: error

      - name: Upload design token evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-token-report
          path: artifacts/design-tokens/
          if-no-files-found: error

      - name: Upload editor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-report
          path: artifacts/editor/
          if-no-files-found: error

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Upload renderer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-report
          path: artifacts/renderer/
          if-no-files-found: error

      - name: Create foundation evidence
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/foundation
          node --version > artifacts/foundation/toolchain.txt
          pnpm --version >> artifacts/foundation/toolchain.txt
          node -e "const p=require('./package.json'); console.log(JSON.stringify({name:p.name,packageManager:p.packageManager,engines:p.engines},null,2))" > artifacts/foundation/package-metadata.json
          git ls-files apps packages tests .github/workflows > artifacts/foundation/repository-tree.txt

      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-report
          path: artifacts/foundation/
          if-no-files-found: error

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
