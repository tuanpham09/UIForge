name: Issue 44 lint diagnostics

on:
  push:
    branches:
      - feat/issue-44-canvas-frame-presets-sections

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
      - run: pnpm install --no-frozen-lockfile
      - name: Capture Biome diagnostics
        run: |
          pnpm lint > lint-output.txt 2>&1 || true
          cat lint-output.txt
      - name: Comment diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("lint-output.txt", "utf8").slice(-12000);
            const issue = context.payload.pull_request?.number || 44;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: "## Issue #44 Biome diagnostics\n\n" + "\\`\\`\\`text\n" + body + "\n\\`\\`\\`",
            });
